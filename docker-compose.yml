services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenderguard
      POSTGRES_USER: tenderguard
      POSTGRES_PASSWORD: tenderguard_dev
    ports:
      - "5432:5432"
    volumes:
      - tenderguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderguard -d tenderguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  tenderguard-postgres:
